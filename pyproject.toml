[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thonny-ai-assistant"
version = "0.6.3"
description = "Bilingual AI assistant plugin for Thonny"
readme = "README.md"
authors = [
    {name = "TommyLee2009", email = "lcy28898830@gmail.com"}
]
maintainers = [
    {name = "TommyLee2009", email = "lcy28898830@gmail.com"}
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Plugins",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
]
dependencies = ["openai>=1.75.0"]
requires-python = ">=3.8"

[project.urls]
Upstream = "https://github.com/Oliver0804/thonny_openai_gpt"

[project.entry-points."thonny.plugins"]
thonny-ai-assistant = "thonnycontrib.thonny_ai_assistant"

[tool.setuptools.packages.find]
include = ["thonnycontrib", "thonnycontrib.*"]
